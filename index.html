<!doctype html>
<html lang="pt-BR" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Evolutus" />
    <title>Evolutus · Treinos</title>
    <script>
      // Bloqueante e síncrono, de propósito: aplica o tema salvo em localStorage direto no
      // <html> antes do primeiro paint. O ThemeProvider do Primer só escreve esses mesmos
      // atributos no seu próprio wrapper depois que o React monta — sem isso, a página pinta
      // uma vez com o tema padrão do SO e "pisca" para o tema escolhido um instante depois.
      try {
        var mode = localStorage.getItem('colorMode') || 'auto'
        document.documentElement.setAttribute('data-color-mode', mode)
        document.documentElement.setAttribute('data-light-theme', 'light')
        document.documentElement.setAttribute('data-dark-theme', 'dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Rede de segurança final: se o React nunca chegar a montar nada em #root (ex: o
      // próprio módulo main.jsx falhou ao carregar/executar — um erro que acontece antes
      // de existir qualquer árvore React, então nem um Error Boundary alcança), isto
      // troca a tela em branco por uma mensagem simples com botão de recarregar. Não
      // interfere em nada quando o app sobe normalmente.
      setTimeout(function () {
        var root = document.getElementById('root')
        if (!root || root.childElementCount > 0) return
        root.innerHTML =
          '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:100vh;padding:24px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Helvetica,Arial,sans-serif;">' +
          '<h1 style="font-size:20px;margin:0;">Não foi possível carregar o Evolutus</h1>' +
          '<p style="color:#57606a;max-width:420px;margin:0;">Isso costuma se resolver recarregando a página.</p>' +
          '<button onclick="location.reload()" style="padding:8px 20px;border-radius:6px;border:1px solid #d0d7de;background:#1f883d;color:#fff;font-weight:600;font-size:14px;cursor:pointer;">Recarregar</button>' +
          '</div>'
      }, 12000)
    </script>
  </body>
</html>
