_format_version: '2.1'
services:
  - { name: auth, url: 'http://127.0.0.1:9999/', routes: [{ name: auth, strip_path: true, paths: ['/auth/v1/'] }] }
  - { name: rest, url: 'http://127.0.0.1:3000/', routes: [{ name: rest, strip_path: true, paths: ['/rest/v1/'] }] }
  - { name: storage, url: 'http://127.0.0.1:5000/', routes: [{ name: storage, strip_path: true, paths: ['/storage/v1/'] }] }
  - { name: functions, url: 'http://127.0.0.1:9000/', routes: [{ name: functions, strip_path: true, paths: ['/functions/v1/'] }] }
plugins:
  - name: cors
