<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Código para continuar no Evolutus</title>
  </head>
  <body style="margin:0;background:#f6f7f9;font-family:Arial,sans-serif;color:#0b0e14;">
    <main style="max-width:520px;margin:32px auto;padding:32px;background:#fff;border-radius:16px;">
      <p style="font-size:18px;font-weight:700;">Evolutus</p>
      <h1 style="font-size:24px;line-height:1.3;">Código para continuar</h1>
      <p style="line-height:1.6;">Use este código apenas na página do Evolutus que você abriu:</p>
      <p style="padding:18px;background:#f6f7f9;border-radius:12px;text-align:center;font:700 32px monospace;letter-spacing:.12em;">{{ .Token }}</p>
      <p style="line-height:1.6;">Se você não solicitou este código, ignore esta mensagem. Não compartilhe o código com ninguém.</p>
    </main>
  </body>
</html>
