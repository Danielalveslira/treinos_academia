name: Supabase & app tests

# Ambiente isolado e reproduzível (runner do GitHub, descartável a cada execução) para validar
# as migrations de autenticação/sessão (20261113*, 20261114*) e financeiras (20261112*) sem usar
# produção nem qualquer container local compartilhado com outra sessão de trabalho. Não precisa
# de nenhum secret: supabase start cria um Postgres local só para este job e o apaga ao final.
# `pull_request` sozinho já cobre toda PR (qualquer branch, qualquer base) -- é o gatilho de
# validação obrigatória. `push` fica só para `main` (estado pós-merge/deploy): um branch com PR
# aberta nunca mais dispara os dois eventos para o MESMO commit (antes, "finance-ci-*" no push
# fazia isso, dobrando os pulls de imagem Docker e deixando um "check" cancelado confuso na PR).
# Para validar um branch ANTES de abrir a PR, use workflow_dispatch.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Pelo nome do branch -- evita que pushes rápidos em sequência para a mesma PR rodem em
# paralelo; a mais nova cancela a mais velha em vez de as duas disputarem o runner. Push a
# `main` usa o SHA (sempre único) em vez do branch: dois merges em sequência não podem mais
# cancelar a verificação pós-merge um do outro, o que apagaria o sinal que `workflow_run`
# (auto-release.yml) espera para aquele commit.
concurrency:
  group: finance-ci-${{ github.event_name == 'push' && github.sha || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

defaults:
  run:
    shell: bash

jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Immutable migration history and unique forward versions
        run: node scripts/check-migration-integrity.mjs
      - run: node --test scripts/check-migration-integrity.test.mjs
      - run: npm run lint
      - run: node --test scripts/release/*.test.mjs
      - run: npm test
      - name: Public catalogue snapshot and lazy counter regression
        run: node --test tests/public-catalog-snapshot.test.mjs tests/storefront-public-handler.test.mjs tests/storefront-seo.test.mjs tests/professional-public-handler.test.mjs
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://header-smoke.invalid
          VITE_SUPABASE_ANON_KEY: header-smoke-public-key
      - run: npm run budget
      - name: Cache Playwright browser binary
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install isolated browser
        run: node node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell
      - name: Public and auth headers at mobile and desktop widths
        run: node scripts/public-auth-header-smoke.mjs
      - name: Workout sheets mobile, execution and conflict smoke
        run: node scripts/workout-sheets-browser-smoke.mjs
      - name: Community cover crop and responsive layout smoke
        run: node scripts/community-cover-layout-smoke.mjs
      - name: Sheet entry redirects and exercise selection intent
        run: node scripts/workout-sheets-browser-smoke.mjs --entries
      - name: Home V4 recommendation, completion, cache, photos and responsive themes
        run: node scripts/home-v2-browser-smoke.mjs
      - run: node scripts/ad-metrics-browser-smoke.mjs
      - name: Ads UX card list and 4-step creation wizard, mobile/desktop and themes
        run: node scripts/ads-ux-browser-smoke.mjs
      - name: Storefront/products UX card list, BRL price form and Meu negócio navigation
        run: node scripts/storefront-products-ux-browser-smoke.mjs
      - run: node scripts/phase3-exercises-browser-smoke.mjs
      - name: Offline cold start and synchronization regression
        run: node scripts/offline-browser-smoke.mjs
      - run: node scripts/release/scan-secrets.mjs --dist

  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Reuse the exact CLI installed by npm ci/package-lock; no floating setup action.
      - run: node_modules/.bin/supabase --version
      # `supabase start` aplica todas as migrations em supabase/migrations/, em ordem, contra um
      # Postgres novo -- é a própria prova de que elas se aplicam em sequência numa base limpa.
      - run: node_modules/.bin/supabase start
      # pg_prove roda SÓ as suítes pgTAP de verdade (convenção do projeto: toda suíte termina em
      # "_test.sql"). supabase/tests/_helpers/auth_session.sql é um include (\ir), não uma suíte, e
      # finance_preflight_readonly.sql / status_expiration_performance.sql são scripts de
      # diagnóstico/performance sem plano pgTAP -- nenhum dos três é um teste, então nenhum dos três
      # deve ser invocado como um. Passar o glob explícito corrige a descoberta na raiz, sem
      # precisar inspecionar log nem mascarar exit code: o status deste passo É o status real do
      # pg_prove (bash -e do runner já propaga `run:` != 0 como falha do step).
      - run: node_modules/.bin/supabase test db supabase/tests/*_test.sql
      - name: Workout sheets SQL assertions and query plans
        run: node scripts/workout-sheets-sql-evidence.mjs
      - name: Home V2 concurrency and aggregate query plans
        run: node scripts/home-v2-sql-evidence.mjs
      - name: Home V4 completion concurrency and before/after query plans
        run: node scripts/home-v4-sql-evidence.mjs
      # Include the real PostgreSQL integration scenarios; no production secrets.
      # Container name follows project_id in supabase/config.toml.
      - run: npm run test:functions
        env:
          PG_TEST_CONTAINER: supabase_db_treinos_academia
          PG_TEST_USER: supabase_admin
      # Concorrência real (processos/commits de verdade disputando o mesmo usuário/dia) --
      # pgTAP roda numa transação só e não prova isto; por isso são scripts à parte, não
      # arquivos `*_test.sql`. Mesmo container/usuário de test:functions acima.
      - run: bash supabase/tests/evocoins_concurrency.sh
        env:
          PG_TEST_CONTAINER: supabase_db_treinos_academia
          PG_TEST_USER: supabase_admin
      - run: bash supabase/tests/user_activity_concurrency.sh
        env:
          PG_TEST_CONTAINER: supabase_db_treinos_academia
          PG_TEST_USER: supabase_admin
      - name: Workout sheet create_workout_sheet() same-request_id concurrency
        run: bash supabase/tests/workout_sheet_create_concurrency.sh
        env:
          PG_TEST_CONTAINER: supabase_db_treinos_academia
          PG_TEST_USER: supabase_admin
      - name: EvoCash price publication and quote concurrency
        run: node scripts/evocash-pricing-concurrency.mjs
        env:
          PG_TEST_CONTAINER: supabase_db_treinos_academia
          PG_TEST_USER: supabase_admin
      - name: Commercial wallet, price and renewal concurrency
        run: node scripts/commercial-engine-concurrency.mjs
        env:
          PG_TEST_CONTAINER: supabase_db_treinos_academia
      - name: Commercial promotion review concurrency (PR0 revision/state guard)
        run: node scripts/commercial-promotion-review-concurrency.mjs
        env:
          PG_TEST_CONTAINER: supabase_db_treinos_academia
      - name: Concrete storefront purchase, renewal and moderation concurrency
        run: node scripts/storefront-revisions-concurrency.mjs
        env:
          PG_TEST_CONTAINER: supabase_db_treinos_academia
      - name: Professional and establishment editorial, renewal and media concurrency
        run: node scripts/professional-listings-concurrency.mjs
        env:
          PG_TEST_CONTAINER: supabase_db_treinos_academia
      - name: Multiple resources per owner, creation limits and shared-wallet concurrency
        run: node scripts/multiple-listings-concurrency.mjs
        env:
          PG_TEST_CONTAINER: supabase_db_treinos_academia
      - name: Advertising capacity, shared balance, global slots and replay concurrency
        run: node scripts/advertising-concurrency.mjs
        env:
          PG_TEST_CONTAINER: supabase_db_treinos_academia
      - name: Institutional advertising activation capacity concurrency
        run: node scripts/institutional-advertising-concurrency.mjs
        env:
          PG_TEST_CONTAINER: supabase_db_treinos_academia
      - name: Refund request, reservation and spending concurrency
        run: node scripts/refunds-concurrency.mjs
        env:
          PG_TEST_CONTAINER: supabase_db_treinos_academia
      - name: Free community benefit and tier upgrade price-change concurrency
        run: node scripts/community-free-creation-concurrency.mjs
        env:
          PG_TEST_CONTAINER: supabase_db_treinos_academia
      # Limpeza roda sempre (sucesso ou falha do passo acima), mas sem alterar o motivo da falha:
      # se o passo anterior falhou, o job já está marcado como falho antes deste rodar.
      - if: always()
        run: node_modules/.bin/supabase stop

  finance-e2e:
    name: finance-e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Run 40389672797: APT levou 13m12s com retries no mirror Azure, stack/migrations
    # ~1m32s e E2E ~5m06s; PASS coincidiu com o timeout de 20 min antes do cleanup.
    # 30 min deixa margem limitada para downloads e encerramento sem reduzir os testes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use official HTTPS Ubuntu mirror for browser dependencies
        run: |
          # O runner usa esta mirrorlist; evita o mirror Azure HTTP que reteve os
          # downloads do run 40389672797. Mantém verificação TLS e assinaturas APT.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - name: Cache Playwright browser binary
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install isolated browser
        run: node node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell
      # GHCR oficial primeiro; ECR oficial somente em falha transitória, com o mesmo
      # digest OCI fixado e verificação da imagem antes de iniciar qualquer container.
      - name: Verify pinned image acquisition and secure fallback
        run: node --test scripts/homolog/finance/images.test.mjs scripts/homolog/finance/cache.test.mjs
      - name: Restore verified official OCI images
        id: oci-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /tmp/finance-oci-cache/images.tar
          key: finance-oci-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/homolog/finance/images.mjs', 'scripts/homolog/finance/cache.mjs') }}
      - name: Authenticate GHCR image reads
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Verify restored OCI image configurations
        if: steps.oci-cache.outputs.cache-hit == 'true'
        run: node scripts/homolog/finance/cache.mjs restore
      - name: Start disposable local stack (db + auth + storage + rest + edge)
        run: node scripts/homolog/finance/stack.mjs start
      - name: Save verified official OCI images on cache miss
        if: steps.oci-cache.outputs.cache-hit != 'true'
        run: node scripts/homolog/finance/cache.mjs save
      - name: Apply all migrations to the disposable stack
        run: node scripts/homolog/finance/migrate.mjs all evolutus_integrated_db
      # Sessão real do GoTrue, RPC real via PostgREST, PostgreSQL real -- ver o cabeçalho do script.
      - name: Real activity-reward E2E (browser -> RPC -> Postgres -> ledger -> wallet -> UI)
        run: node scripts/evocoins-activity-e2e-smoke.mjs
      - name: Advertising capacity, shared balance, global slots and replay concurrency
        run: node scripts/advertising-concurrency.mjs
        env:
          PG_TEST_CONTAINER: evolutus_integrated_db
      # Limpeza roda sempre, sem mascarar o motivo de uma falha anterior (mesmo padrão do job sql).
      - if: always()
        name: Stop disposable local stack
        run: node scripts/homolog/finance/stack.mjs stop

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node scripts/release/scan-secrets.mjs

  quality:
    name: finance-quality
    if: always()
    needs: [js, sql, finance-e2e, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every mandatory job to succeed
        env:
          JS_RESULT: ${{ needs.js.result }}
          SQL_RESULT: ${{ needs.sql.result }}
          FINANCE_E2E_RESULT: ${{ needs.finance-e2e.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        run: |
          set -euo pipefail
          test "$JS_RESULT" = success
          test "$SQL_RESULT" = success
          test "$FINANCE_E2E_RESULT" = success
          test "$SECRETS_RESULT" = success
